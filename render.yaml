# Prepared configuration. Applying this creates a paid, non-sleeping service.
# Confirm the current compute price before creating it. No database is replaced.
services:
  - type: web
    name: roundhouse-web
    runtime: node
    repo: https://github.com/buildroundhouse/RoundHouse
    branch: fix/permanent-phone-hosting
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm run build:hosted
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    plan: 0.5c-512mb
    region: ohio
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3001"
      - key: ROUNDHOUSE_WEB_DIR
        value: dist/web
      - key: ROUNDHOUSE_DISABLE_ACCOUNT_PURGE
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: round-house-nfm9r
      - key: EXPO_PUBLIC_FIREBASE_PROJECT_ID
        value: round-house-nfm9r
      - key: EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: round-house-nfm9r.firebaseapp.com
      - key: EXPO_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: DATABASE_URL
        sync: false
